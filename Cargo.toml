[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/Map1en/Snowcase"

[workspace.dependencies]
snowcase-formats = { path = "crates/formats" }
snowcase-core = { path = "crates/core" }
snowcase-store = { path = "crates/store" }
thiserror = "2"
tempfile = "3"
gpui-kit = "0.9"
diesel = { version = "2.4", features = ["sqlite", "returning_clauses_for_sqlite_3_35"] }
diesel_migrations = { version = "2.4", features = ["sqlite"] }
libsqlite3-sys = { version = "0.40", features = ["bundled"] }
